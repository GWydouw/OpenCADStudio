name: Desktop beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta release tag
        required: true
        type: string
      target:
        description: Build both platforms or retry Windows only
        default: all
        type: choice
        options: [all, windows]

permissions:
  contents: read

concurrency:
  group: desktop-beta-${{ inputs.tag }}-${{ inputs.target || 'all' }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RUST_MIN_STACK: "67108864"

jobs:
  regressions:
    if: inputs.target != 'windows'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev
      - name: Verify beta version
        run: |
          python3 scripts/beta_release.py versions --tag "$RELEASE_TAG"
          python3 scripts/test_beta_release.py
      - name: Test combined fixes
        env:
          LC_ALL: C
        run: |
          cargo test --lib scroll_intent_tests --locked
          cargo test --lib transparency_ --locked

  build-windows:
    timeout-minutes: 90
    runs-on: windows-latest
    permissions:
      contents: write
    # Step-level `if:` cannot read the `secrets` context, so the signing
    # waterfall is driven by these boolean mirrors of the credential secrets.
    env:
      AZURE_SIGNING_CONFIGURED: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' }}
      PFX_CONFIGURED: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # Full history so build.rs can measure the distance from the
          # release tag; a shallow clone would label the build `+g<hash>`.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package versions
        id: version
        shell: bash
        run: python3 scripts/beta_release.py versions --tag "$RELEASE_TAG"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-beta
          cache-on-failure: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Convert SVG icon to ICO
        shell: pwsh
        run: |
          magick assets/logo.svg `
            -define icon:auto-resize=16,24,32,48,64,128,256 `
            packaging/windows/AppIcon.ico

      - name: Convert DWG/DXF file icons to ICO
        shell: pwsh
        run: |
          # DWG/DXF Explorer file icons, from the single-source mimetype SVGs.
          # The SVGs are 48x48; rasterize them at 16x that (-density) before
          # auto-resize, otherwise the 64..256 sizes are upscaled from 48px
          # and look blurry in Explorer.
          magick -background none -density 1536 assets/mimetypes/image-vnd.dwg.svg `
            -define icon:auto-resize=16,24,32,48,64,128,256 `
            packaging/windows/dwg.ico
          magick -background none -density 1536 assets/mimetypes/image-vnd.dxf.svg `
            -define icon:auto-resize=16,24,32,48,64,128,256 `
            packaging/windows/dxf.ico

      - name: Build
        env:
          OCS_PATREON_TOKEN: ${{ secrets.OCS_PATREON_TOKEN }}
        shell: bash
        run: |
          cargo build --locked --release
          cargo build --locked --release -p dwg-thumbnailer-win

      - name: Verify executable version
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          result = subprocess.run(
              ["target/release/OpenCADStudio.exe", "--version"],
              stdin=subprocess.DEVNULL, capture_output=True, text=True,
              check=True, timeout=30,
          )
          print(result.stdout)
          expected = "OpenCADStudio " + os.environ["RELEASE_TAG"][1:]
          lines = result.stdout.splitlines()
          if not lines or lines[0] != expected:
              raise SystemExit(f"Unexpected executable version: {result.stdout!r}; stderr: {result.stderr!r}")
          PYTHON

      # Forks do not inherit repository secrets, so every signing step is
      # gated on its credentials being present and the pipeline falls through:
      # Azure Trusted Signing (upstream setup) -> PFX certificate -> unsigned.
      - name: Sign executable (Azure Trusted Signing)
        if: env.AZURE_SIGNING_CONFIGURED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\target\release\OpenCADStudio.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Import signing certificate (PFX fallback)
        if: env.AZURE_SIGNING_CONFIGURED != 'true' && env.PFX_CONFIGURED == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          "Imported signing certificate to $pfxPath"

      - name: Sign executable (certificate)
        if: env.AZURE_SIGNING_CONFIGURED != 'true' && env.PFX_CONFIGURED == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.DirectoryName -match 'x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          & $signtool sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 `
            /f (Join-Path $env:RUNNER_TEMP "signing.pfx") /p $env:WINDOWS_PFX_PASSWORD `
            (Resolve-Path target\release\OpenCADStudio.exe).Path
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for the executable" }

      - name: Note unsigned executable
        if: env.AZURE_SIGNING_CONFIGURED != 'true' && env.PFX_CONFIGURED != 'true'
        shell: pwsh
        run: |
          "No signing credentials configured - add the Azure Trusted Signing secrets or WINDOWS_PFX_BASE64/WINDOWS_PFX_PASSWORD to sign. Building UNSIGNED." >> $env:GITHUB_STEP_SUMMARY

      - name: Build MSI installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.msi }}"
          $candle = Join-Path $env:WIX "bin\candle.exe"
          $light  = Join-Path $env:WIX "bin\light.exe"
          $exePath  = (Resolve-Path target\release\OpenCADStudio.exe).Path
          $iconPath = (Resolve-Path packaging\windows\AppIcon.ico).Path
          # GPL-3 license RTF shown on the installer's EULA page.
          $licensePath = (Resolve-Path packaging\windows\License.rtf).Path
          # main.wxs holds the package/feature; ui.wxs holds the installer UI
          # and finish-screen launch checkbox. Both compile together.
          $mainWxs  = (Resolve-Path packaging\windows\main.wxs).Path
          $uiWxs     = (Resolve-Path packaging\windows\ui.wxs).Path
          # candle writes one .wixobj per source into this directory (the
          # trailing slash tells it -out is a folder, not a single file).
          $objDir   = Join-Path $PWD "packaging\windows\"
          $msiPath  = Join-Path $PWD "OpenCADStudio.msi"
          & $candle -arch x64 `
            "-dVersion=$version" `
            "-dSource=$exePath" `
            "-dIcon=$iconPath" `
            "-dLicense=$licensePath" `
            $mainWxs $uiWxs `
            -out $objDir
          if ($LASTEXITCODE -ne 0) { throw "candle failed" }
          $mainObj = Join-Path $objDir "main.wixobj"
          $uiObj   = Join-Path $objDir "ui.wixobj"
          & $light $mainObj $uiObj -ext WixUIExtension -cultures:en-us -loc packaging/windows/strings.en-US.wxl -out $msiPath
          if ($LASTEXITCODE -ne 0) { throw "light failed" }

      - name: Sign MSI installer (Azure Trusted Signing)
        # The installer itself must be signed separately - light produces a
        # fresh, unsigned .msi even though the .exe inside is already signed.
        if: env.AZURE_SIGNING_CONFIGURED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\OpenCADStudio.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign MSI installer (certificate)
        if: env.AZURE_SIGNING_CONFIGURED != 'true' && env.PFX_CONFIGURED == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.DirectoryName -match 'x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          & $signtool sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 `
            /f (Join-Path $env:RUNNER_TEMP "signing.pfx") /p $env:WINDOWS_PFX_PASSWORD `
            (Resolve-Path OpenCADStudio.msi).Path
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for the MSI" }

      - name: Note unsigned MSI
        if: env.AZURE_SIGNING_CONFIGURED != 'true' && env.PFX_CONFIGURED != 'true'
        shell: pwsh
        run: |
          "MSI left unsigned - no signing credentials configured." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload artifacts to release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $exe = "OpenCADStudio-$tag-windows-x86_64-portable.exe"
          $msi = "OpenCADStudio-$tag-windows-x86_64-installer.msi"
          Move-Item target\release\OpenCADStudio.exe $exe
          Move-Item OpenCADStudio.msi $msi
          $checksums = "OpenCADStudio-$tag-windows-SHA256SUMS.txt"
          @($exe, $msi) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $_"
          } | Set-Content $checksums -Encoding ascii
          gh release upload $tag `
            $exe $msi $checksums `
            --clobber --repo ${{ github.repository }}

  build-macos:
    if: inputs.target != 'windows'
    timeout-minutes: 90
    runs-on: macos-14    # Apple Silicon (arm64) only
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # Full history so build.rs can measure the distance from the
          # release tag; a shallow clone would label the build `+g<hash>`.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package versions
        id: version
        shell: bash
        run: python3 scripts/beta_release.py versions --tag "$RELEASE_TAG"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-beta
          cache-on-failure: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install librsvg (for rsvg-convert)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install librsvg

      - name: Build
        env:
          OCS_PATREON_TOKEN: ${{ secrets.OCS_PATREON_TOKEN }}
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin -p dwg-thumbnailer
          # The launcher shim is the .app's actual CFBundleExecutable (#1039)
          # — see src/bin/ocs_launcher.rs for why.
          cargo build --locked --release --target aarch64-apple-darwin --bin ocs_launcher

      - name: Verify executable version
        run: |
          VERSION=$(target/aarch64-apple-darwin/release/OpenCADStudio --version | head -1)
          test "$VERSION" = "OpenCADStudio ${RELEASE_TAG#v}"

      - name: Build .icns from SVG
        run: |
          mkdir -p OpenCADStudio.iconset
          # Render all the sizes Apple expects in an .icns.
          for SIZE in 16 32 64 128 256 512 1024; do
            rsvg-convert -w $SIZE -h $SIZE assets/logo.svg -o OpenCADStudio.iconset/icon_${SIZE}x${SIZE}.png
          done
          # @2x retina variants (half-size base name)
          for BASE in 16 32 128 256 512; do
            DOUBLE=$((BASE * 2))
            cp OpenCADStudio.iconset/icon_${DOUBLE}x${DOUBLE}.png OpenCADStudio.iconset/icon_${BASE}x${BASE}@2x.png
          done
          iconutil -c icns OpenCADStudio.iconset -o AppIcon.icns

      - name: Build DWG/DXF document .icns from the same SVG sources
        run: |
          # Finder document icons (Info.plist CFBundleTypeIconFile = DWG/DXF),
          # generated from the single-source mimetype SVGs — never hand-drawn.
          for T in dwg dxf; do
            mkdir -p "$T.iconset"
            for SIZE in 16 32 64 128 256 512 1024; do
              rsvg-convert -w $SIZE -h $SIZE "assets/mimetypes/image-vnd.$T.svg" \
                -o "$T.iconset/icon_${SIZE}x${SIZE}.png"
            done
            for BASE in 16 32 128 256 512; do
              cp "$T.iconset/icon_$((BASE*2))x$((BASE*2)).png" \
                 "$T.iconset/icon_${BASE}x${BASE}@2x.png"
            done
            iconutil -c icns "$T.iconset" -o "$(echo "$T" | tr a-z A-Z).icns"
          done

      - name: Build DWG QuickLook thumbnail extension (.appex)
        run: |
          set -e
          VERSION="${{ steps.version.outputs.cargo }}"
          EXT=DWGThumbnail.appex
          rm -rf "$EXT"; mkdir -p "$EXT/Contents/MacOS"
          swiftc \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -target arm64-apple-macos11 \
            -O -parse-as-library -application-extension \
            -module-name DWGThumbnail \
            -import-objc-header crates/dwg-thumbnailer/macos/dwg_thumbnailer.h \
            crates/dwg-thumbnailer/macos/ThumbnailProvider.swift \
            -L target/aarch64-apple-darwin/release -ldwg_thumbnailer \
            -framework QuickLookThumbnailing -framework CoreGraphics \
            -framework ImageIO -framework Foundation -framework Security \
            -framework SystemConfiguration -liconv \
            -Xlinker -e -Xlinker _NSExtensionMain \
            -o "$EXT/Contents/MacOS/DWGThumbnail"
          sed "s/__VERSION__/$VERSION/g" crates/dwg-thumbnailer/macos/Info.plist > "$EXT/Contents/Info.plist"

      - name: Assemble .app bundle
        run: |
          APP=OpenCADStudio.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/PlugIns"
          # Finder opens the launcher, which relays files to the sibling GUI.
          cp target/aarch64-apple-darwin/release/ocs_launcher "$APP/Contents/MacOS/OpenCADStudio"
          cp target/aarch64-apple-darwin/release/OpenCADStudio "$APP/Contents/MacOS/OpenCADStudio-App"
          chmod +x "$APP/Contents/MacOS/OpenCADStudio" "$APP/Contents/MacOS/OpenCADStudio-App"
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp DWG.icns DXF.icns "$APP/Contents/Resources/"
          # First-party Python scripting plugin. It remains out of process and
          # uses the same API/toolchain as this host build. Its own lock file
          # has to name the codec the plugin API pins, and a codec bump that
          # forgot it failed the --locked build (v2026.42); follow the pin
          # here, which also lets an older tag be rebuilt.
          cargo update -p acadrust --manifest-path plugins/opencad-python/Cargo.toml
          # Stage with this workflow's own copy of the staging script: a
          # rebuilt older tag may carry one that no longer reads its lock
          # (v2026.42 looked for the codec under its pre-rename name).
          git fetch --no-tags --depth=1 origin ${{ github.workflow_sha }}
          git show FETCH_HEAD:plugins/opencad-python/tools/stage-bundled.sh \
            > plugins/opencad-python/tools/stage-bundled.sh
          bash plugins/opencad-python/tools/stage-bundled.sh \
            "$APP/Contents/Resources/plugins/opencad.python" \
            --target aarch64-apple-darwin
          # QuickLook thumbnail extension.
          cp -R DWGThumbnail.appex "$APP/Contents/PlugIns/"
          # Substitute version into Info.plist.
          VERSION="${{ steps.version.outputs.cargo }}"
          sed "s/__VERSION__/$VERSION/g" packaging/Info.plist > "$APP/Contents/Info.plist"

      - name: Ad-hoc code-sign the bundle
        run: |
          codesign --force --sign - --timestamp=none OpenCADStudio.app/Contents/MacOS/OpenCADStudio-App
          codesign --force --sign - --timestamp=none \
            --entitlements crates/dwg-thumbnailer/macos/entitlements.plist \
            OpenCADStudio.app/Contents/PlugIns/DWGThumbnail.appex
          codesign --force --sign - --timestamp=none OpenCADStudio.app
          codesign --verify --deep --strict --verbose=2 OpenCADStudio.app
          # --xml keeps newer codesign builds from prefixing text headers,
          # which made the entitlements parse fail with InvalidFileException.
          codesign -d --entitlements - --xml OpenCADStudio.app/Contents/PlugIns/DWGThumbnail.appex \
            | python3 -c 'import io, plistlib, sys; ent = plistlib.load(io.BytesIO(sys.stdin.buffer.read())); print("entitlements:", ent); assert ent.get("com.apple.security.app-sandbox") is True'

      # Exercise CFBundleExecutable, not just the inner application: the
      # Finder launcher must preserve --mcp and the client's stdio pipes.
      - name: Verify packaged MCP handshake
        timeout-minutes: 2
        run: python3 docs/automation/mcp_handshake.py OpenCADStudio.app/Contents/MacOS/OpenCADStudio

      # Stage the app beside an /Applications symlink so the mounted image
      # offers drag-to-install (#769), matching packaging/build_macos_signed.sh.
      - name: Create .dmg
        run: |
          rm -rf dmg-staging
          mkdir dmg-staging
          cp -R OpenCADStudio.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          set +e
          for attempt in 1 2 3 4 5; do
            hdiutil detach "/Volumes/Open CAD Studio" >/dev/null 2>&1 || true
            rm -f OpenCADStudio.dmg
            hdiutil create \
              -volname "Open CAD Studio" \
              -srcfolder dmg-staging \
              -ov -format UDZO \
              OpenCADStudio.dmg && break
            echo "hdiutil create failed (attempt $attempt) — retrying in 5s"
            sleep 5
          done
          set -e
          test -f OpenCADStudio.dmg
          rm -rf dmg-staging

      - name: Verify .dmg layout
        run: |
          MNT=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" OpenCADStudio.dmg
          ls -la "$MNT"
          test -d "$MNT/OpenCADStudio.app"
          test "$(readlink "$MNT/Applications")" = /Applications
          codesign --verify --deep --strict "$MNT/OpenCADStudio.app"
          hdiutil detach "$MNT"

      - name: Upload .dmg as workflow artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: OpenCADStudio-macos-arm64-dmg
          path: OpenCADStudio.dmg
          if-no-files-found: error

      - name: Upload .dmg to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET=OpenCADStudio-${{ env.RELEASE_TAG }}-macos-arm64.dmg
          mv OpenCADStudio.dmg "$ASSET"
          gh release upload ${{ env.RELEASE_TAG }} "$ASSET" --clobber --repo ${{ github.repository }}

      - name: Upload macOS checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="OpenCADStudio-${RELEASE_TAG}-macos-arm64.dmg"
          SUMS="OpenCADStudio-${RELEASE_TAG}-macos-SHA256SUMS.txt"
          shasum -a 256 "$ASSET" > "$SUMS"
          gh release upload "$RELEASE_TAG" "$SUMS" --clobber --repo "${{ github.repository }}"

  verify-and-publish:
    if: always() && needs.build-windows.result == 'success' && (needs.regressions.result == 'success' || needs.regressions.result == 'skipped') && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    needs: [regressions, build-windows, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all downloads before publishing the beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/beta_release.py verify --tag "$RELEASE_TAG" --repo "${{ github.repository }}"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --repo "${{ github.repository }}"
